<!doctype html>
<!--
  data-theme carries the whole theme. It is set here to avoid a flash of the
  wrong palette, then kept in sync by the theme provider. No component reads
  anything but the tokens this attribute selects.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="ReeferReady PMS — container readiness pipeline" />
    <title>ReeferReady PMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint: light is the default for every new visitor,
      // regardless of OS preference. A returning user who explicitly chose
      // dark via the toggle never sees a light-theme flash first.
      (function () {
        try {
          var saved = localStorage.getItem('pms-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* private mode — the default in the markup stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
